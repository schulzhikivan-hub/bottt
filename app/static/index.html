<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a43"><title>KOREA HUB</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/extra.css"></head>
<body><div class="app">
<header><div class="brand"><div class="logo">🇰🇷</div><div><b>KOREA HUB</b><small>Всё для жизни в Корее</small></div></div></header>

<section id="view-home">
  <div class="welcome"><span class="eyebrow">СООБЩЕСТВО ИНОСТРАНЦЕВ</span><h1>Твоя жизнь<br>в Южной Корее</h1><p>Работа, жильё, покупки — в одном месте.</p></div>
  <div class="search"><input id="search" placeholder="Поиск вакансий и объявлений"><button id="searchBtn">⌕</button></div>
  <section class="tiles">
    <button data-cat="job" class="tile blue"><span>💼</span><b>Работа</b><small>Вакансии и подработка</small></button>
    <button data-cat="housing" class="tile green"><span>🏠</span><b>Жильё</b><small>Квартиры и комнаты</small></button>
    <button data-cat="marketplace" class="tile orange"><span>🛍️</span><b>Барахолка</b><small>Купить и продать</small></button>
    <button class="tile pink" data-soon="Знакомства"><span>💗</span><b>Знакомства</b><small>Скоро</small></button>
    <button class="tile violet" data-soon="Сообщество"><span>👥</span><b>Сообщество</b><small>Скоро</small></button>
    <button class="tile teal" data-soon="Услуги"><span>🛠️</span><b>Услуги</b><small>Скоро</small></button>
  </section>
  <div class="section-head"><div><span class="eyebrow">СВЕЖИЕ ПУБЛИКАЦИИ</span><h2 id="listTitle">Последние объявления</h2></div><button class="link" id="allBtn">Все →</button></div>
  <div id="listings" class="listings"><div class="empty">Загружаем объявления…</div></div>
</section>

<section id="view-saved" hidden>
  <div class="section-head"><div><span class="eyebrow">СОХРАНЁННОЕ</span><h2>Избранное</h2></div></div>
  <div id="favorites" class="listings"></div>
</section>

<section id="view-chats" hidden>
  <div class="section-head"><div><span class="eyebrow">ПЕРЕПИСКА</span><h2>Сообщения</h2></div></div>
  <div id="conversations" class="listings"></div>
</section>

<section id="view-chat" hidden>
  <div class="section-head"><div><button class="link" id="chatBack">← Назад</button><h2 id="chatTitle">Чат</h2></div></div>
  <div id="messages" class="messages"></div>
  <form id="chatForm" class="chat-form"><input id="chatInput" maxlength="2000" placeholder="Сообщение" required><button type="submit">➤</button></form>
</section>

<section id="view-profile" hidden>
  <div class="section-head"><div><span class="eyebrow">ЛИЧНЫЙ КАБИНЕТ</span><h2>Мои объявления</h2></div></div>
  <div id="myListings" class="listings"></div>
</section>

<nav class="bottom">
  <button class="active" data-view="home">⌂<small>Главная</small></button>
  <button data-view="saved">♡<small>Избранное</small></button>
  <button class="add" id="addBtn">＋<small>Добавить</small></button>
  <button data-view="chats">☰<small>Сообщения</small></button>
  <button data-view="profile">♙<small>Профиль</small></button>
</nav>
</div>

<div id="modal" class="modal hidden"><div class="sheet"><div class="sheet-top"><b>Новое объявление</b><button id="closeModal">✕</button></div>
<form id="listingForm"><label>Категория<select name="category"><option value="job">Работа</option><option value="housing">Жильё</option><option value="marketplace">Барахолка</option></select></label>
<label>Заголовок<input name="title" required minlength="3" maxlength="160" placeholder="Например: Работа на заводе"></label><label>Город<input name="city" required maxlength="80" placeholder="Например: Асан"></label>
<label>Цена / зарплата<input name="price" maxlength="80" placeholder="Например: 2 800 000 ₩/мес"></label><label>Описание<textarea name="description" rows="3" maxlength="4000" placeholder="Подробности объявления"></textarea></label><label>Контакт<input name="contact" maxlength="160" placeholder="Telegram или телефон"></label>
<button class="submit" type="submit">Отправить на проверку</button></form></div></div>
<div id="toast" class="toast"></div>
<script src="/static/app.js"></script></body></html>
