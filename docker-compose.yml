services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: koreahub
      POSTGRES_USER: koreahub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koreahub -d koreahub"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://koreahub:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/koreahub
    depends_on:
      db:
        condition: service_healthy
    # Not published to the host: only Caddy reaches it.
    expose:
      - "8000"
    volumes:
      - uploads_data:/srv/uploads
    # Two web processes by default (set WEB_WORKERS in .env). Rate limits are counted per process: see docs/LOAD.md
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${WEB_WORKERS:-2}"]

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://koreahub:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/koreahub
    depends_on:
      - api
    # The bot shows listing and profile photos in the chat and in the admin screens: it needs the same files as the API
    volumes:
      - uploads_data:/srv/uploads
    command: ["python", "-m", "app.bot"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
