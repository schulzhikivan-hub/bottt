name: Deploy VPS config

# Работает на self-hosted runner самого VPS. Репозиторий должен быть приватным:
# runner выполняет код из репозитория, поэтому внешние PR сюда запускать нельзя.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, linux, vps]
    timeout-minutes: 30
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Проверка синтаксиса скриптов
        run: |
          for f in setup/*.sh; do bash -n "$f"; done

      - name: Применить конфиги и установку
        run: sudo -n ./setup/install.sh

      - name: Проверить сервисы
        run: |
          systemctl is-active --quiet xrdp
          systemctl is-active --quiet fail2ban
