name: Bootstrap VPS (one-time)

# Запускается вручную, один раз, с нуля. Ставит всё на VPS через ssh.
# Нужные секреты перечислены в README, раздел «Автоустановка».
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_ROOT_PASSWORD: ${{ secrets.VPS_ROOT_PASSWORD }}
      OWNER_PUBKEY: ${{ secrets.OWNER_PUBKEY }}
      OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
    steps:
      - name: Проверить секреты
        run: |
          missing=0
          for v in VPS_HOST VPS_ROOT_PASSWORD OWNER_PUBKEY OWNER_PASSWORD TS_AUTHKEY RUNNER_ADMIN_TOKEN; do
            if [ -z "${!v:-}" ]; then echo "Не задан секрет: $v"; missing=1; fi
          done
          exit $missing

      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Получить токен регистрации runner
        run: |
          token="$(curl -fsS -X POST \
            -H "Authorization: Bearer $RUNNER_ADMIN_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runners/registration-token" \
            | jq -r .token)"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "Токен не получен: проверьте RUNNER_ADMIN_TOKEN (нужен доступ Administration: write)"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "RUNNER_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Передать и запустить установку на VPS
        run: |
          sudo apt-get install -y sshpass >/dev/null
          export SSHPASS="$VPS_ROOT_PASSWORD"

          tar czf /tmp/bottt.tgz --exclude=.git -C "$GITHUB_WORKSPACE" .

          umask 077
          {
            printf 'OWNER_USER=%s\n' "owner"
            printf 'OWNER_PUBKEY=%q\n' "$OWNER_PUBKEY"
            printf 'OWNER_PASSWORD=%q\n' "$OWNER_PASSWORD"
            printf 'TS_AUTHKEY=%q\n' "$TS_AUTHKEY"
            printf 'RUNNER_TOKEN=%q\n' "$RUNNER_TOKEN"
            printf 'REPO_URL=%q\n' "https://github.com/$GITHUB_REPOSITORY"
            printf 'REPO_NAME=%q\n' "${GITHUB_REPOSITORY#*/}"
          } > /tmp/bootstrap.env

          ssh_opts=(-o StrictHostKeyChecking=accept-new)
          sshpass -e scp "${ssh_opts[@]}" /tmp/bottt.tgz /tmp/bootstrap.env "root@$VPS_HOST:/tmp/"
          rm -f /tmp/bottt.tgz /tmp/bootstrap.env

          sshpass -e ssh "${ssh_opts[@]}" "root@$VPS_HOST" '
            set -euo pipefail
            rm -rf /opt/bottt && mkdir -p /opt/bottt
            tar xzf /tmp/bottt.tgz -C /opt/bottt && rm -f /tmp/bottt.tgz
            chmod +x /opt/bottt/setup/*.sh
            bash /opt/bottt/setup/bootstrap-runner.sh /tmp/bootstrap.env
          '
